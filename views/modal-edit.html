<div class="bg-white rounded shadow-xl w-full max-w-lg border border-gray-300">
    <div class="p-4 border-b border-gray-200 flex justify-between items-center bg-gray-50">
        <h3 class="font-bold text-brand-dark">Editar Registro</h3>
        <button onclick="closeEditModal()" class="text-gray-400 hover:text-brand-red transition-colors"><i class="ph ph-x text-xl"></i></button>
    </div>
    <form id="edit-form" class="p-6">
        <input type="hidden" id="edit-id">
        <div class="mb-4">
            <label class="block text-xs font-bold text-gray-600 mb-1">Classificação</label>
            <select id="edit-cat" required class="w-full p-2.5 border border-gray-300 rounded text-sm bg-white focus:border-brand-dark outline-none">
                <option value="enchente">Alagamento / Enchente</option>
                <option value="deslizamento">Movimentação de Massa (Deslizamento)</option>
                <option value="lixo">Acúmulo Crítico de Resíduos</option>
                <option value="arvore">Queda de Árvore / Bloqueio Viário</option>
            </select>
        </div>
        <div class="mb-6">
            <label class="block text-xs font-bold text-gray-600 mb-1">Descrição</label>
            <textarea id="edit-desc" required rows="4" class="w-full p-2.5 border border-gray-300 rounded text-sm bg-white focus:border-brand-dark outline-none resize-none"></textarea>
        </div>
        <div class="flex justify-end gap-3">
            <button type="button" onclick="closeEditModal()" class="px-4 py-2 border border-gray-300 rounded text-sm font-semibold text-gray-700 hover:bg-gray-100 transition-colors">Cancelar</button>
            <button type="submit" class="px-4 py-2 bg-brand-dark text-white rounded text-sm font-semibold hover:bg-gray-800 transition-colors">Salvar Alterações</button>
        </div>
    </form>
</div>
