<div class="overflow-x-auto bg-white border border-gray-200 rounded shadow-sm">
    <table class="w-full text-left text-sm border-collapse">
        <thead>
            <tr class="bg-gray-50 border-b border-gray-200 text-gray-600 font-bold text-xs uppercase tracking-wider">
                <th class="p-4">Protocolo</th>
                <th class="p-4">Data</th>
                <th class="p-4">Classificação</th>
                <th class="p-4">Endereço</th>
                <th class="p-4">Status</th>
                <th class="p-4 text-right">Ações</th>
            </tr>
        </thead>
        <tbody id="c-historico-table" class="divide-y divide-gray-200"></tbody>
    </table>
</div>

<template id="history-row-template">
    <tr class="hover:bg-gray-50 transition-colors">
        <td class="p-4 font-mono text-xs font-bold text-gray-700 row-id"></td>
        <td class="p-4 text-xs text-gray-500 row-date"></td>
        <td class="p-4 text-xs font-semibold text-gray-800 row-cat"></td>
        <td class="p-4 text-xs text-gray-600 truncate max-w-[200px] row-addr"></td>
        <td class="p-4">
            <div class="flex items-center gap-1.5 text-[10px] font-bold uppercase row-status-container">
                <span class="w-1.5 h-1.5 rounded-full row-status-dot"></span>
                <span class="row-status-label"></span>
            </div>
        </td>
        <td class="p-4 text-right">
            <button class="text-brand-blue hover:underline text-xs font-semibold mr-3 btn-edit">Editar</button>
            <button class="text-brand-red hover:underline text-xs font-semibold btn-delete">Excluir</button>
        </td>
    </tr>
</template>
