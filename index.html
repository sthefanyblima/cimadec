<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIMADEC | Plataforma de Gestão de Crises Urbanas</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { blue: '#0B3B60', red: '#9B1B30', dark: '#111827', gray: '#F3F4F6', light: '#E5E7EB' } }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/main.css">
</head>
<body class="bg-brand-gray text-brand-dark font-sans h-screen overflow-hidden flex flex-col">

    <div id="landing-view" class="fixed inset-0 z-50 bg-white overflow-y-auto flex flex-col" data-include="views/landing.html"></div>

    <div id="app-wrapper" class="hidden w-full h-full flex">

        <aside id="sidebar" class="w-64 bg-white border-r border-gray-200 flex flex-col shrink-0 fixed md:static inset-y-0 left-0 z-[70] -translate-x-full md:translate-x-0 transition-transform duration-200" data-include="views/sidebar.html"></aside>

        <!-- Backdrop do menu no mobile -->
        <div id="sidebar-backdrop" class="hidden fixed inset-0 bg-black/40 z-[65] md:hidden" onclick="toggleSidebar(false)"></div>

        <main class="flex-1 flex flex-col min-w-0 bg-gray-50 relative">
            
            <div id="global-alert-banner" class="hidden absolute top-0 left-0 w-full z-[60] bg-brand-red text-white px-8 py-3 shadow-lg flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <i class="ph-fill ph-warning-octagon text-2xl animate-pulse"></i>
                    <div>
                        <p class="text-sm font-bold tracking-wide">ALERTA AUTOMATIZADO DE RISCO</p>
                        <p id="global-alert-msg" class="text-xs text-red-200">Sensores detectaram anomalia crítica na sua região.</p>
                    </div>
                </div>
                <button onclick="this.parentElement.classList.add('hidden')" class="text-white hover:text-red-200"><i class="ph ph-x"></i></button>
            </div>

            <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-4 md:px-8 shrink-0">
                <div class="flex items-center gap-3">
                    <button onclick="toggleSidebar()" class="md:hidden text-brand-dark hover:text-brand-blue transition-colors" aria-label="Abrir menu de navegação">
                        <i class="ph ph-list text-2xl"></i>
                    </button>
                    <h2 id="page-title" class="text-lg font-bold text-brand-dark">Dashboard</h2>
                </div>
                <div class="text-xs font-mono text-gray-500 border border-gray-300 px-3 py-1 rounded flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-green-600 block animate-pulse"></span> Sensores Ativos
                </div>
            </header>

            <div class="flex-1 overflow-auto p-8 relative">
                <div id="view-c-dashboard" class="hidden flex-col gap-6" data-include="views/c-dashboard.html"></div>
                <div id="view-c-reportar" class="hidden max-w-3xl mx-auto" data-include="views/c-reportar.html"></div>
                <div id="view-c-historico" class="hidden flex-col gap-4 max-w-5xl mx-auto" data-include="views/c-historico.html"></div>
                <div id="view-c-alertas" class="hidden flex-col gap-4 max-w-5xl mx-auto" data-include="views/c-alertas.html"></div>

                <div id="view-o-dashboard" class="hidden flex-col gap-6" data-include="views/o-dashboard.html"></div>
                <div id="view-o-mapa" class="hidden h-full flex-col bg-white border border-gray-200 rounded shadow-sm" data-include="views/o-mapa.html"></div>
                <div id="view-o-triagem" class="hidden flex-col" data-include="views/o-triagem.html"></div>

                <div id="view-em-construcao" class="hidden flex-col items-center justify-center h-full text-gray-400">
                    <i class="ph ph-wrench text-5xl mb-4 text-gray-300"></i>
                    <h3 class="text-lg font-bold text-gray-500">Módulo Indisponível</h3>
                    <p class="text-sm">Área em desenvolvimento para a Fase 2.</p>
                </div>
            </div>
        </main>
    </div>

    <div id="edit-modal" class="hidden fixed inset-0 z-[100] bg-brand-dark/60 flex items-center justify-center p-4" data-include="views/modal-edit.html"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/data.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/notify.js"></script>
    <script src="js/map.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/citizen.js"></script>   <script src="js/operator.js"></script>  <script src="js/iot.js"></script>       <script src="js/form.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
